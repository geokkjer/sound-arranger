[package]
name = "sound-arranger-shell"
version = "0.1.0"
description = "RETIRED (2026-09-22) Tauri v2 shell — kept frozen as a reference; see ../RETIRED.md."
edition = "2021"

# Retired: excluded from the root workspace (see ../../Cargo.toml), so it needs
# its own workspace table to stay buildable in place.
[workspace]

# The lib is the Host-API bridge; `_lib` avoids the bin/lib same-name
# self-reference so `main.rs` can call `sound_arranger_shell_lib::run()`.
[lib]
name = "sound_arranger_shell_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
host = { path = "../../host" }
media = { path = "../../media" }
engine = { path = "../../engine" }
