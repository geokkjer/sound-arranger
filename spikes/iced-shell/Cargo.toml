[package]
name = "iced-shell"
version = "0.1.0"
edition = "2024"
publish = false
description = "iced spike — the minimal proof that a second, in-process Rust shell can drive the Host API (iced-shell evaluation note)"

# Its own workspace on purpose: iced (and wgpu) must not enter the default
# `cargo build --workspace` of the core. This is an evaluation, not a shell yet.
[workspace]

[dependencies]
# `canvas` and `image` are off by default in iced; `iced_audio` needs both to
# draw (canvas for the widget, image for its renderer bounds on the fallback
# renderer).
iced = { version = "0.14", features = ["canvas", "image"] }
# The audio widgets: faders/knobs/sliders whose ranges are dB, frequency and
# integer-aware, plus tick/text marks and a modulation range. MIT, same iced_core
# 0.14 this shell uses, maintained in the iced org:
# https://github.com/iced-rs/iced_audio
iced_audio = "0.17"
host = { path = "../../crates/host" }
# The shared shell workflow: modes, keys, actions. This shell is the *second* one to
# speak it, which is the whole point — one table, two shells.
workflow = { path = "../../crates/workflow" }
